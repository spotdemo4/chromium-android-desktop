name: build

on:
  workflow_dispatch:
    inputs:
      force:
        description: Build even when the latest release already matches the latest stable Android version
        required: false
        default: false
        type: boolean
      enable_hevc:
        description: Enable platform HEVC/H.265 support
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: builder

    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v7
        with:
          clean: false
          fetch-depth: 1

      - name: Compare latest stable Android Chromium and latest release
        id: version_check
        uses: actions/github-script@v9
        with:
          script: |
            const parseVersion = (version) => version.split('.').map(Number);
            const compareVersions = (a, b) => {
              const pa = parseVersion(a);
              const pb = parseVersion(b);
              for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
                const diff = (pa[i] || 0) - (pb[i] || 0);
                if (diff !== 0) return diff;
              }
              return 0;
            };

            const versionSources = [
              {
                name: 'chromiumdash.appspot.com',
                url: 'https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Android&num=10',
                extract: (data) => data.map((release) => release.version),
              },
              {
                name: 'versionhistory.googleapis.com',
                url: 'https://versionhistory.googleapis.com/v1/chrome/platforms/android/channels/stable/versions?pageSize=10',
                extract: (data) => data.versions.map((release) => release.version),
              },
            ];

            let chromiumVersion = '';
            const versionErrors = [];
            for (const source of versionSources) {
              try {
                core.info(`Fetching latest stable Android version from ${source.name}`);
                const versionResponse = await fetch(source.url);
                if (!versionResponse.ok) {
                  throw new Error(`${versionResponse.status} ${versionResponse.statusText}`);
                }
                const versions = source
                  .extract(await versionResponse.json())
                  .filter((version) => /^\d+\.\d+\.\d+\.\d+$/.test(version));
                if (versions.length === 0) {
                  throw new Error('No versions found in response');
                }
                chromiumVersion = versions.sort(compareVersions).at(-1);
                break;
              } catch (error) {
                versionErrors.push(`${source.name}: ${error.message}`);
                core.warning(`Failed to fetch latest stable Android version from ${source.name}: ${error.message}`);
              }
            }

            if (!chromiumVersion) {
              throw new Error(`Failed to fetch latest stable Android version from all sources: ${versionErrors.join('; ')}`);
            }

            let latestReleaseTag = '';
            let latestReleaseVersion = '';
            try {
              const release = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              latestReleaseTag = release.data.tag_name || '';
              latestReleaseVersion = latestReleaseTag.replace(/^v/, '');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const shouldBuild = chromiumVersion !== latestReleaseVersion;

            core.info(`Latest stable Android version: ${chromiumVersion}`);
            core.info(`Latest release tag: ${latestReleaseTag || '(none)'}`);
            core.info(`Build required: ${shouldBuild}`);

            core.setOutput('chromium_version', chromiumVersion);
            core.setOutput('latest_release_tag', latestReleaseTag);
            core.setOutput('latest_release_version', latestReleaseVersion);
            core.setOutput('should_build', String(shouldBuild));

      - name: Skip unchanged Chromium version
        if: steps.version_check.outputs.should_build != 'true' && inputs.force != true
        run: |
          printf 'Latest stable Android version is %s; latest release is %s. Skipping build.\n' \
            '${{ steps.version_check.outputs.chromium_version }}' \
            '${{ steps.version_check.outputs.latest_release_tag }}'

      - name: Build Chromium Android Desktop APK
        if: steps.version_check.outputs.should_build == 'true' || inputs.force == true
        id: build
        shell: bash
        env:
          CHROMIUM_GITCOOKIES: ${{ secrets.CHROMIUM_GITCOOKIES }}
        run: |
          set -Eeuo pipefail

          chromium_workspace=${CHROMIUM_WORKSPACE:-$HOME/Dev/chromium-android}
          chromium_version='${{ steps.version_check.outputs.chromium_version }}'
          local_apk="$GITHUB_WORKSPACE/artifacts/ChromePublic_arm64.apk"

          enable_hevc=1
          if [[ '${{ inputs.enable_hevc }}' == 'false' ]]; then
            enable_hevc=0
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          WORKSPACE="$chromium_workspace" \
          LOCAL_APK="$local_apk" \
          ENABLE_HEVC="$enable_hevc" \
          CHROMIUM_VERSION="$chromium_version" \
          bash "$GITHUB_WORKSPACE/build.sh"

          version_file="$chromium_workspace/chromium/src/chrome/VERSION"
          actual_version=$(
            awk -F= '
              $1 == "MAJOR" { major=$2 }
              $1 == "MINOR" { minor=$2 }
              $1 == "BUILD" { build=$2 }
              $1 == "PATCH" { patch=$2 }
              END { printf "%s.%s.%s.%s", major, minor, build, patch }
            ' "$version_file"
          )

          actual_apk="$local_apk"

          sha256=$(sha256sum "$actual_apk" | awk '{ print $1 }')

          printf 'version=%s\n' "$actual_version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$actual_version" >> "$GITHUB_OUTPUT"
          printf 'apk=%s\n' "$actual_apk" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: steps.version_check.outputs.should_build == 'true' || inputs.force == true
        uses: actions/upload-artifact@v7
        with:
          name: ChromePublic_arm64-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.version_check.outputs.should_build == 'true' || inputs.force == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          name: ${{ steps.build.outputs.version }}
          make_latest: true
          files: ${{ steps.build.outputs.apk }}
          body: |
            Chromium Android Desktop build with extension support and proprietary codecs.

            Version: `${{ steps.build.outputs.version }}`
            SHA-256: `${{ steps.build.outputs.sha256 }}`

            Build flags include `is_desktop_android=true`, `proprietary_codecs=true`, `ffmpeg_branding="Chrome"`, and platform HEVC enabled when requested.
