name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run ShellCheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck
